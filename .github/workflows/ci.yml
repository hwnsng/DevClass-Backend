name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-test:
    name: Spring Boot Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: devclass_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Run tests
        working-directory: server/DevClass
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/devclass_test?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root1234
          JWT_SECRET: test-secret-key-at-least-32-chars-long
        run: ./gradlew test --no-daemon

  client-build:
    name: Next.js Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/devclass-ui/package-lock.json

      - name: Install dependencies
        working-directory: client/devclass-ui
        run: npm ci

      - name: Build
        working-directory: client/devclass-ui
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [server-test, client-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t devclass-server:${{ github.sha }} ./server

      - name: Build client image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080/api -t devclass-client:${{ github.sha }} ./client
